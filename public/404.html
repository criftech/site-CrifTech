<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: #0b1220; color: #e2e8f0; }
      .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { width: 100%; max-width: 560px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 18px; padding: 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.35); }
      h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -0.02em; }
      p { margin: 0 0 18px; line-height: 1.5; color: rgba(226, 232, 240, 0.82); }
      a { display: inline-block; padding: 10px 14px; border-radius: 12px; background: #0066ff; color: white; font-weight: 700; text-decoration: none; }
      a:hover { background: #0052cc; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; color: rgba(148, 163, 184, 0.9); margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>404 - Page not found</h1>
        <p>The URL you entered doesn’t exist on CrifTech.</p>
        <a href="/">Go to Homepage</a>
        <div class="code">Error: NOT_FOUND</div>
      </div>
    </div>
  </body>
</html>
