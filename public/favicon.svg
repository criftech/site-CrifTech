<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="55%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B3A8A" />
      <stop offset="100%" stop-color="#031634" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <clipPath id="clip">
      <circle cx="32" cy="32" r="31" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <circle cx="32" cy="32" r="31" fill="url(#bg)" />
    <circle cx="32" cy="32" r="31" fill="none" stroke="#0F172A" stroke-width="2" />

    <g filter="url(#shadow)">
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(7 7)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(6 6)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(5 5)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(4 4)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(3 3)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(2 2)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#edge)" transform="translate(1 1)">CT</text>

      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="url(#face)">CT</text>
      <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Sora, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" fill="#FFFFFF" opacity="0.16" transform="translate(-1 -1)">CT</text>
    </g>
  </g>
</svg>
